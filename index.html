(function () {
  'use strict';
  var GAME_BASE = 'https://theblazerader.github.io/blooket-sets/';
  var GAMES_JSON = GAME_BASE + 'games.json';
  var trigger = document.querySelector('[data-games-dropdown-trigger="true"]');
  var menu = document.getElementById('dm-games-dropdown');
  var overlay = document.getElementById('dm-game-overlay');
  var gameFrame = overlay && overlay.querySelector('iframe');
  var closeButton = document.getElementById('dm-game-overlay-close');
  if (!trigger || !menu || !overlay || !gameFrame) return;

  var loaded = false, loading = false, isOpen = false;

  function positionMenu() {
    if (!isOpen) return;
    var rect = trigger.getBoundingClientRect();
    var width = Math.min(280, Math.max(180, window.innerWidth - 16));
    menu.style.width = width + 'px';
    var left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8));
    menu.style.left = left + 'px';
    menu.style.top = '4px';
    var height = menu.getBoundingClientRect().height;
    var top = rect.bottom + 4;
    if (top + height > window.innerHeight - 8) top = rect.top - height - 4;
    menu.style.top = Math.max(8, Math.min(top, window.innerHeight - height - 8)) + 'px';
  }

  function closeMenu() {
    isOpen = false;
    menu.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
  }

  function openMenu() {
    isOpen = true;
    menu.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
    positionMenu();
    if (!loaded && !loading) loadGames();
  }

  function launchGame(url) {
    closeMenu();
    gameFrame.src = url;
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';
  }

  function closeGame() {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    gameFrame.src = 'about:blank';
    document.documentElement.style.overflow = '';
  }

  function loadGames() {
    loading = true;
    menu.innerHTML = '<div class="status">Loading games...</div>';
    fetch(GAMES_JSON, { cache: 'no-store' }).then(function (response) {
      if (!response.ok) throw new Error('games.json returned ' + response.status);
      return response.json();
    }).then(function (games) {
      if (!Array.isArray(games)) throw new Error('games.json must contain an array');
      menu.textContent = '';
      games.forEach(function (game) {
        if (!game || typeof game.name !== 'string' || typeof game.file !== 'string') return;
        var file = game.file.trim();
        if (!file || /^(?:[a-z]+:)?\/\//i.test(file) || file.charAt(0) === '/' || file.split('/').indexOf('..') !== -1) return;
        var url = new URL(file, GAME_BASE).href;
        var item = document.createElement('button');
        item.type = 'button';
        item.setAttribute('role', 'menuitem');
        item.textContent = game.name;
        item.addEventListener('click', function () { launchGame(url); });
        menu.appendChild(item);
      });
      if (!menu.children.length) menu.innerHTML = '<div class="status">No games found in games.json.</div>';
      loaded = true;
    }).catch(function (error) {
      console.error('Could not load games:', error);
      menu.innerHTML = '<div class="status">Could not load games. Check games.json and your connection.</div>';
    }).finally(function () {
      loading = false;
      positionMenu();
    });
  }

  trigger.addEventListener('click', function (event) {
    event.preventDefault();
    event.stopPropagation();
    if (isOpen) closeMenu(); else openMenu();
  });
  trigger.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (isOpen) closeMenu(); else openMenu();
    }
  });
  document.addEventListener('click', function (event) {
    if (!menu.contains(event.target) && event.target !== trigger && !trigger.contains(event.target)) closeMenu();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      if (overlay.classList.contains('open')) closeGame();
      else closeMenu();
    }
  });
  closeButton.addEventListener('click', closeGame);
  overlay.addEventListener('click', function (event) {
    if (event.target === overlay) closeGame();
  });
  window.addEventListener('scroll', positionMenu, true);
  window.addEventListener('resize', positionMenu);
  window.addEventListener('message', function (event) {
    var data = event.data;
    if (data && data.type === 'syc-open-game' && typeof data.url === 'string') {
      try {
        var u = new URL(data.url);
        if (u.origin === 'https://theblazerader.github.io') launchGame(u.href);
      } catch (e) {}
    }
  });
})();
</script>

    field.addEventListener('keydown',function(event){

    field.addEventListener('blur',function(){
      var value=field.textContent.trim();
      if(!value){field.textContent=field.getAttribute('data-default')||(field.getAttribute('data-edit-key')==='dm-user-name'?'Hunter Gordon':'Algebra I - 5th Period');value=field.textContent;}
      try{localStorage.setItem(key,value);}catch(e){}

    field.addEventListener('click',function(event){event.stopPropagation();});
  });
})();
